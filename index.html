<!DOCTYPE html>
<html>
        <head>
        <title>My Page</title>
        <style>
            .container {
                background-color: rbg(145, 145, 154);
                width: 100%;
                height: 100vh;
                display: flex;
                gap: 10px;
                flex-direction: column;
                padding-top: 15px;
                padding-right: 30px;
                padding-bottom: 15px;
                padding-left: 30px;
            }


            .logo {
                width: 100%;
                height: 150px;
                background-color: rgb(61, 61,61);
                padding: 20px;
            }


            .nav {
                width: 100%;
                height: 100px;
                background-color: rgb(61, 61,61);
                padding: 20px;
            }


            .header {
                width: 100%;
                height: 250px;
                background-color: rgb(61, 61,61);
                padding: 20px;
            }


            .item{
                background-color:rgb(61, 61,61);
                width: 100px;
                height: 100%;
                padding: 20px;
            }


            .content {
                width: 100%;
                height: 500px;
                display: flex;
                gap: 15px
                padding: 20px;
            }


            .slidebar {
                flex:1;
                background-color: rgb(61, 61, 61);
                padding: 20px;
            }


            .body {
                flex:3;
                background-color: rgb(61, 61, 61);
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">Logo</div>
            <div class="nav">Navigation</div>
            <div class="header">Header / Banner</div>
            <div class="content">
                <div class="slidebar">Slide bar</div>
                <div class="body">Body Area</div>
            </div>
        </div>
    </body>
</html>
